@if (messageService.message$ | async; as msg) {
<button
    type="button"
    class="mpx-1 cmn-message-section"
    [attr.aria-label]="'Meldung schließen: ' + msg.message"
    (click)="close()">
    @switch (msg.level) { @case ('INFO') {
    <span class="mpx-1 cmn-message cmn-message-text msg-info">
        <mat-icon class="cmn-message-icon">check_circle</mat-icon>
        <span class="cmn-message-text">{{ msg.message }}</span>
    </span>
    } @case ('WARN') {
    <span class="mpx-1 cmn-message cmn-message-text msg-warn">
        <mat-icon class="cmn-message-icon">warning</mat-icon>
        <span class="cmn-message-text">{{ msg.message }}</span>
    </span>
    } @case ('ERROR') {
    <span class="mpx-1 cmn-message cmn-message-text msg-error">
        <mat-icon class="cmn-message-icon">warning</mat-icon>
        <span class="cmn-message-text">{{ msg.message }}</span>
    </span>
    } }
</button>
}
